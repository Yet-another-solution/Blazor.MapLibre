name: PR Build and Test

on:
  pull_request:
    branches:
      - "main"
      - "release/*"

jobs:
  pr-build:
    name: Build Projects
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - src/Community.Blazor.MapLibre/Community.Blazor.MapLibre.csproj
          - docs/Community.Blazor.MapLibre.Documentation.csproj
          - examples/Community.Blazor.MapLibre.Examples/Community.Blazor.MapLibre.Examples.csproj
          - examples/Community.Blazor.MapLibre.Examples.MapboxGlPlugin/Community.Blazor.MapLibre.Examples.MapboxGlPlugin.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore all project dependencies
        run: dotnet restore

      - name: Build ${{ matrix.project }}
        run: dotnet build ${{ matrix.project }} --no-restore -c Release

  pr-test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: pr-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build test project
        run: dotnet build tests/Community.Blazor.MapLibre.Tests/Community.Blazor.MapLibre.Tests.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/Community.Blazor.MapLibre.Tests/Community.Blazor.MapLibre.Tests.csproj --no-build -c Release --verbosity normal

  pr-e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: pr-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Community.Blazor.MapLibre.Tests.E2E/package-lock.json

      - name: Install npm dependencies
        working-directory: tests/Community.Blazor.MapLibre.Tests.E2E
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/Community.Blazor.MapLibre.Tests.E2E
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/Community.Blazor.MapLibre.Tests.E2E
        run: npm test
